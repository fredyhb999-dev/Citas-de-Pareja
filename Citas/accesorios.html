<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Actividades y Accesorios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --rojo: #ff5c7a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%; width:100%;
    color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; padding:max(66px, calc(env(safe-area-inset-top) + 30px)) 20px max(28px, env(safe-area-inset-bottom));
    position:relative;
  }

  .back{
    position:absolute; top:max(20px, env(safe-area-inset-top)); left:20px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:500;
    color: var(--fg-muted); text-decoration:none;
  }
  .back:hover{ color: var(--fg); }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.8rem; letter-spacing:.3em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:10px;
  }
  h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 8px; text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.desc{
    font-size:.88rem; color:var(--fg-muted); max-width:340px; margin:0 0 18px; text-align:center;
  }

  .tabs{ display:flex; gap:10px; margin-bottom:22px; }
  .tabs a{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); text-decoration:none;
    padding:10px 18px; border-radius:12px;
    border:1px solid var(--card-border); background: var(--card);
  }
  .tabs a.activo, .tabs button.activo{ color: var(--teal); border-color: var(--teal); }
  .tabs button{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); padding:10px 18px; border-radius:12px; cursor:pointer;
    border:1px solid var(--card-border); background: var(--card);
  }
  .panel{ display:none; width:100%; max-width:520px; margin:0 0 16px;
    background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:18px; }
  .panel.ver{ display:block; }
  [hidden]{ display:none !important; }

  #alta{
    width:100%; max-width:420px; margin-bottom:10px;
  }
  #alta .fila{ display:flex; gap:10px; }
  #alta input{
    font-family:'Inter', sans-serif; flex:1; min-width:0;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
    padding:14px; font-size:1rem;
  }
  #btnAgregar{
    font-family:'Chakra Petch', sans-serif; font-weight:700; letter-spacing:.04em;
    border:none; border-radius:14px; cursor:pointer; padding:14px 20px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    transition: transform .15s ease, opacity .2s ease;
    white-space:nowrap;
  }
  #btnAgregar:active{ transform: scale(.97); }
  #btnAgregar:disabled{ opacity:.4; }
  #btnAgregar.eliminar{ background: var(--rojo); color:#2b0410; }

  #msg{
    min-height:20px; font-size:.85rem; color:var(--rojo);
    margin:8px 0 16px; text-align:center; max-width:420px;
  }
  #msg.ok{ color: var(--teal); }

  #conteo{
    font-size:.8rem; color:var(--fg-muted); opacity:.8; margin-bottom:10px;
  }

  #lista{
    width:100%; max-width:520px;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
  }
  .item{
    background: var(--card); border:1px solid var(--card-border);
    border-radius:10px; padding:10px 8px;
    font-size:.78rem; text-align:center;
    word-break:break-word;
  }
  .item.nuevo{ border-color: var(--teal); }
  .seccionCfg{ width:100%; max-width:520px; margin:30px 0 6px; text-align:center; }
  .seccionCfg h2{ font-family:'Chakra Petch',sans-serif; font-size:1.1rem; margin:0 0 6px; }
  .seccionCfg .mini{ font-size:.82rem; color:var(--fg-muted); margin:0 0 12px; }
  #listaUsuariosCfg{ display:flex; flex-direction:column; gap:10px; }
  #listaUsuariosCfg button{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; color:var(--fg); padding:12px; font-size:.95rem; font-family:'Chakra Petch',sans-serif; cursor:pointer; }
  #listaUsuariosCfg button.yo{ border-color:var(--teal); }
  #qrCajaCfg{ background:#fff; padding:12px; border-radius:14px; display:none; justify-content:center; margin:0 auto 12px; width:fit-content; }
  .btnCfg{ font-family:'Chakra Petch',sans-serif; font-weight:700; border:none; border-radius:12px; cursor:pointer; padding:12px 22px; color:var(--bg); background:linear-gradient(90deg, var(--coral), var(--teal)); }
  .btnCfg:active{ transform:scale(.97); }
  .filaCfg{ display:flex; gap:8px; margin-top:12px; }
  .filaCfg input{ flex:1; min-width:0; border-radius:12px; border:1px solid var(--card-border);
    background:var(--bg); color:var(--fg); padding:12px; font-size:.95rem; font-family:'Inter',sans-serif; }
</style>
</head>
<body>

<a class="back" href="../index.html">← Volver</a>

<div class="eyebrow">Configuración</div>
<h1 id="tituloCfg">Actividades y Accesorios</h1>
<p class="desc" id="descCfg">Elige una opción para configurar tu app.</p>

<div class="tabs">
  <a href="actividades.html">Actividades</a>
  <button id="tabLista" type="button">Accesorios</button>
</div>

<div class="tabs">
  <button id="tabUsuario" type="button">Usuarios</button>
  <button id="tabVincular" type="button">Vincular</button>
</div>

<div class="panel" id="panelUsuario">
  <div class="seccionCfg" style="margin:0">
    <h2>Usuarios</h2>
    <p class="mini" id="quienCfg">…</p>
    <div id="listaUsuariosCfg"></div>
    <div class="filaCfg">
      <input id="nuevoInvitado" type="text" placeholder="Nuevo invitado (ej. Amante)" maxlength="30" autocomplete="off">
      <button id="btnAddCfg" class="btnCfg">Agregar</button>
    </div>
  </div>
</div>

<div class="panel" id="panelVincular">
  <div class="seccionCfg" style="margin:0">
    <h2>Vincular pareja 📱</h2>
    <p class="mini">Tu pareja lo escanea desde su app (inicio → Tengo QR). Muéstralo en persona.</p>
    <div id="qrCajaCfg"></div>
    <button id="btnQRCfg" class="btnCfg">Mostrar mi código</button>
  </div>
</div>

<div id="alta">
  <div class="fila">
    <input id="nombreNuevo" type="text" placeholder="Nombre del accesorio" maxlength="60" autocomplete="off">
    <button id="btnAgregar">Agregar</button>
  </div>
</div>

<div id="msg"></div>
<div id="conteo" hidden></div>
<div id="lista" hidden></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

import firebaseConfigBase from "../firebase-config.js";
import { resolverFirebase, leerConfigGuardada, cargarUsuarios } from "../config.js";
const firebaseConfig = resolverFirebase(firebaseConfigBase);

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const extrasRef = collection(db, "accesoriosExtra");

// ====== ESTADO ======
const listaEl = document.getElementById("lista");
const conteoEl = document.getElementById("conteo");
const msgEl = document.getElementById("msg");
const inputEl = document.getElementById("nombreNuevo");
const btnAgregar = document.getElementById("btnAgregar");

let catalogo = [];  // del JSON (no se pueden eliminar desde la app)
let extras = [];    // de Firebase: [{id, nombre}] (sí se pueden eliminar)

let modo = "agregar";   // "agregar" | "eliminar"
let docObjetivo = null;

function normalizar(s){
  return (s || "").trim().toLowerCase();
}

function nombresCatalogo(){
  return new Set(catalogo.map(normalizar));
}

function listaCombinada(){
  const vistos = new Set();
  const salida = [];
  catalogo.concat(extras.map(e=>e.nombre)).forEach(n=>{
    const clave = normalizar(n);
    if(clave && !vistos.has(clave)){
      vistos.add(clave);
      salida.push(n.trim());
    }
  });
  return salida.sort((a,b)=>a.localeCompare(b,"es"));
}

function buscarExtra(clave){
  return extras.find(e=>normalizar(e.nombre) === clave) || null;
}

function pintar(){
  const todos = listaCombinada();
  const nombresExtras = new Set(extras.map(e=>normalizar(e.nombre)));
  listaEl.innerHTML = "";
  todos.forEach(n=>{
    const div = document.createElement("div");
    div.className = "item" + (nombresExtras.has(normalizar(n)) ? " nuevo" : "");
    div.textContent = n;
    listaEl.appendChild(div);
  });
  conteoEl.textContent = todos.length + (todos.length === 1 ? " accesorio" : " accesorios");
}

// Si lo escrito coincide con uno agregado desde la app,
// el botón se convierte en "Eliminar".
function actualizarModo(){
  const clave = normalizar(inputEl.value);

  if(!clave){
    modo = "agregar";
    docObjetivo = null;
    btnAgregar.textContent = "Agregar";
    btnAgregar.classList.remove("eliminar");
    msgEl.textContent = "";
    msgEl.className = "";
    return;
  }

  const extra = buscarExtra(clave);
  if(extra){
    modo = "eliminar";
    docObjetivo = extra.id;
    btnAgregar.textContent = "Eliminar";
    btnAgregar.classList.add("eliminar");
    msgEl.textContent = "";
    msgEl.className = "";
    return;
  }

  modo = "agregar";
  docObjetivo = null;
  btnAgregar.textContent = "Agregar";
  btnAgregar.classList.remove("eliminar");

  if(nombresCatalogo().has(clave)){
    msgEl.textContent = "Ese accesorio ya existe.";
    msgEl.className = "";
  }else{
    msgEl.textContent = "";
    msgEl.className = "";
  }
}

function avisar(texto, ok){
  msgEl.textContent = texto;
  msgEl.className = ok ? "ok" : "";
}

async function cargar(){
  try{
    const r = await fetch("accesorios.json");
    const data = await r.json();
    catalogo = Array.isArray(data) ? data : [];
  }catch(e){
    catalogo = [];
  }

  try{
    const snap = await getDocs(extrasRef);
    extras = [];
    snap.forEach(d=>{
      const n = d.data().nombre;
      if(n) extras.push({ id: d.id, nombre: n });
    });
  }catch(e){
    extras = [];
  }

  pintar();
  actualizarModo();
}

async function agregar(){
  const nombre = inputEl.value.trim();
  if(!nombre){
    avisar("Escribe el nombre del accesorio.");
    return;
  }

  const clave = normalizar(nombre);
  const existe = listaCombinada().some(n=>normalizar(n) === clave);
  if(existe){
    avisar("Ese accesorio ya existe.");
    return;
  }

  btnAgregar.disabled = true;
  try{
    const ref = await addDoc(extrasRef, { nombre: nombre, creadoEn: serverTimestamp() });
    extras.push({ id: ref.id, nombre: nombre });
    pintar();
    inputEl.value = "";
    inputEl.focus();
    actualizarModo();
    avisar("Accesorio agregado.", true);
  }catch(e){
    avisar("No se pudo guardar. Revisa tu conexión.");
  }
  btnAgregar.disabled = false;
}

async function eliminar(){
  if(!docObjetivo) return;

  btnAgregar.disabled = true;
  try{
    await deleteDoc(doc(db, "accesoriosExtra", docObjetivo));
    extras = extras.filter(e=>e.id !== docObjetivo);
    pintar();
    inputEl.value = "";
    inputEl.focus();
    actualizarModo();
    avisar("Accesorio eliminado.", true);
  }catch(e){
    avisar("No se pudo eliminar. Revisa tu conexión.");
  }
  btnAgregar.disabled = false;
}

btnAgregar.onclick = ()=>{
  if(modo === "eliminar"){
    eliminar();
  }else{
    agregar();
  }
};
inputEl.addEventListener("input", actualizarModo);
inputEl.addEventListener("keydown", e=>{
  if(e.key === "Enter") btnAgregar.onclick();
});

// ====== USUARIO + VINCULAR (config) ======
const CLAVE_LOCAL_CFG = "appPareja_quienSoy";
async function pintarUsuarioCfg(){
  const quienEl = document.getElementById("quienCfg");
  const listaU = document.getElementById("listaUsuariosCfg");
  let respaldo = [];
  try{ respaldo = await (await fetch("usuarios.json")).json(); }catch(e){}
  let usuarios = respaldo;
  try{ usuarios = await cargarUsuarios(db, getDoc, doc, respaldo); }catch(e){}
  let yo = null;
  try{ yo = JSON.parse(localStorage.getItem(CLAVE_LOCAL_CFG)); }catch(e){}
  quienEl.textContent = "Actual: " + ((yo && yo.nombre) || "sin elegir");
  listaU.innerHTML = "";
  usuarios.forEach(u=>{
    const fila = document.createElement("div");
    fila.style.cssText = "display:flex;gap:8px;";
    const b = document.createElement("button");
    b.style.flex = "1";
    b.textContent = u.nombre + (yo && yo.id === u.id ? " ✓" : "") + (u.admin ? " ★" : "");
    if(yo && yo.id === u.id) b.className = "yo";
    b.onclick = ()=>{
      localStorage.setItem(CLAVE_LOCAL_CFG, JSON.stringify(u));
      pintarUsuarioCfg();
    };
    fila.appendChild(b);
    if(!u.admin){
      const x = document.createElement("button");
      x.textContent = "✕";
      x.title = "Eliminar invitado";
      x.onclick = ()=>eliminarInvitadoCfg(u.id, u.nombre);
      fila.appendChild(x);
    }
    listaU.appendChild(fila);
  });
}
async function eliminarInvitadoCfg(id, nombre){
  if(!confirm("¿Eliminar a " + nombre + " de la app?")) return;
  try{
    const ref = doc(db, "config", "ajustes");
    const snap = await getDoc(ref);
    const arr = (snap.exists() && Array.isArray(snap.data().usuarios)) ? snap.data().usuarios : [];
    await setDoc(ref, { usuarios: arr.filter(u=>u.id !== id), actualizadoEn: serverTimestamp() }, { merge: true });
    try{
      const loc = JSON.parse(localStorage.getItem("pareja_usuarios") || "[]");
      localStorage.setItem("pareja_usuarios", JSON.stringify(loc.filter(u=>u.id !== id)));
      const yo = JSON.parse(localStorage.getItem(CLAVE_LOCAL_CFG) || "null");
      if(yo && yo.id === id) localStorage.removeItem(CLAVE_LOCAL_CFG);
    }catch(e){}
    pintarUsuarioCfg();
  }catch(e){
    alert("No se pudo eliminar. Revisa tu conexión.");
  }
}
document.getElementById("btnQRCfg").onclick = ()=>{
  const g = leerConfigGuardada();
  const caja = document.getElementById("qrCajaCfg");
  if(!g || !g.firebase){
    caja.style.display = "none";
    alert("Primero termina el asistente del inicio.");
    return;
  }
  caja.innerHTML = "";
  caja.style.display = "flex";
  try{
    new QRCode(caja, {
      text: JSON.stringify({ firebase: g.firebase, telegram: g.telegram || null }),
      width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M
    });
  }catch(e){ caja.textContent = "No se pudo generar."; }
};
// ====== PANELES (lista / usuario / vincular) ======
const tabLista = document.getElementById("tabLista");
const tabUsuario = document.getElementById("tabUsuario");
const tabVincular = document.getElementById("tabVincular");
const panelUsuario = document.getElementById("panelUsuario");
const panelVincular = document.getElementById("panelVincular");
function todosApagados(){
  [tabLista, tabUsuario, tabVincular].forEach(b=>b.classList.remove("activo"));
  panelUsuario.classList.remove("ver");
  panelVincular.classList.remove("ver");
  listaEl.hidden = true;
  conteoEl.hidden = true;
  document.getElementById("alta").style.display = "";
  document.getElementById("tituloCfg").textContent = "Actividades y Accesorios";
  document.getElementById("descCfg").textContent = "Elige una opción para configurar tu app.";
}
function ponerTitulo(t, d){
  document.getElementById("tituloCfg").textContent = t;
  document.getElementById("descCfg").textContent = d;
}
tabLista.onclick = ()=>{
  const abierto = tabLista.classList.contains("activo");
  todosApagados();
  if(!abierto){
    tabLista.classList.add("activo");
    ponerTitulo("Accesorios", "Agrega accesorios nuevos. Se guardan y aparecen en tus citas.");
    listaEl.hidden = false;
    conteoEl.hidden = false;
  }
};
tabUsuario.onclick = ()=>{
  const abierto = tabUsuario.classList.contains("activo");
  todosApagados();
  if(!abierto){
    tabUsuario.classList.add("activo");
    ponerTitulo("Usuarios", "Cambia quién usa este celular o agrega invitados.");
    document.getElementById("alta").style.display = "none";
    panelUsuario.classList.add("ver");
    pintarUsuarioCfg();
  }
};
tabVincular.onclick = ()=>{
  const abierto = tabVincular.classList.contains("activo");
  todosApagados();
  if(!abierto){
    tabVincular.classList.add("activo");
    ponerTitulo("Vincular pareja", "Comparte tu código para vincular a tu pareja.");
    document.getElementById("alta").style.display = "none";
    panelVincular.classList.add("ver");
  }
};
async function agregarInvitadoCfg(){
  const inp = document.getElementById("nuevoInvitado");
  const nombre = inp.value.trim();
  if(!nombre) return;
  const id = "u" + Date.now().toString(36);
  const nuevo = { id, nombre, admin: false };
  try{
    const ref = doc(db, "config", "ajustes");
    const snap = await getDoc(ref);
    const arr = (snap.exists() && Array.isArray(snap.data().usuarios)) ? snap.data().usuarios.slice() : [];
    arr.push(nuevo);
    await setDoc(ref, { usuarios: arr, actualizadoEn: serverTimestamp() }, { merge: true });
    try{
      const loc = JSON.parse(localStorage.getItem("pareja_usuarios") || "[]");
      loc.push(nuevo);
      localStorage.setItem("pareja_usuarios", JSON.stringify(loc));
    }catch(e){}
    inp.value = "";
    pintarUsuarioCfg();
  }catch(e){
    alert("No se pudo agregar. Revisa tu conexión.");
  }
}
document.getElementById("btnAddCfg").onclick = agregarInvitadoCfg;
pintarUsuarioCfg();

cargar();
inputEl.focus();

</script>

</body>
</html>
